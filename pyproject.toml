[project]
name = "clonecut"
version = "0.1.0"
description = "Lucky Dog TikTok tool: AI plans the edit, ffmpeg renders it."
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0",
    "librosa>=0.10",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "pydantic>=2.6",
    "scenedetect>=0.6.4",
    "soundfile>=0.12",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
